<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CorpLens - YC Startup Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen p-4 md:p-8 font-sans antialiased">
  <div class="max-w-7xl mx-auto space-y-8">
    
    <!-- Header & Controls -->
    <header class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 pb-6 border-b border-slate-800">
      <div>
        <div class="flex items-center gap-3">
          <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
          <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-blue-400 via-indigo-300 to-emerald-400 bg-clip-text text-transparent">CorpLens Intelligence</h1>
        </div>
        <p class="text-slate-400 text-sm mt-1">Real-time Y Combinator Pipeline Powered by Bright Data</p>
      </div>

      <!-- Controls: Search, Batch Dropdown, Category Dropdown -->
      <div class="flex flex-col sm:flex-row gap-3 w-full lg:w-auto">
        <div class="relative flex-1 sm:w-64">
          <input type="text" id="searchInput" placeholder="Search startup, CEO, founder..." class="w-full bg-slate-800/90 text-slate-200 pl-10 pr-4 py-2.5 rounded-xl border border-slate-700/80 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm placeholder-slate-500">
          <svg class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>

        <select id="batchSelect" class="bg-slate-800/90 text-slate-200 px-3.5 py-2.5 rounded-xl border border-slate-700/80 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="all">All Batches</option>
        </select>

        <select id="categorySelect" class="bg-slate-800/90 text-slate-200 px-3.5 py-2.5 rounded-xl border border-slate-700/80 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="all">All Categories</option>
        </select>
      </div>
    </header>

    <!-- Analytics Stats Bar -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="statsBar">
      <div class="bg-slate-800/40 border border-slate-800/80 rounded-xl p-4 flex flex-col">
        <span class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Total Scraped</span>
        <span class="text-2xl font-bold text-white mt-1" id="statTotal">0</span>
      </div>
      <div class="bg-slate-800/40 border border-slate-800/80 rounded-xl p-4 flex flex-col">
        <span class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Acquired</span>
        <span class="text-2xl font-bold text-amber-400 mt-1" id="statAcquired">0</span>
      </div>
      <div class="bg-slate-800/40 border border-slate-800/80 rounded-xl p-4 flex flex-col">
        <span class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Public</span>
        <span class="text-2xl font-bold text-blue-400 mt-1" id="statPublic">0</span>
      </div>
      <div class="bg-slate-800/40 border border-slate-800/80 rounded-xl p-4 flex flex-col">
        <span class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Active</span>
        <span class="text-2xl font-bold text-emerald-400 mt-1" id="statActive">0</span>
      </div>
    </div>

    <!-- Quick Status Filters -->
    <div class="flex flex-wrap items-center gap-2">
      <button onclick="filterStatus(this, 'all')" class="status-btn active bg-blue-600 text-white text-xs font-medium px-4 py-2 rounded-lg transition-all">All Companies</button>
      <button onclick="filterStatus(this, 'Acquired')" class="status-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs font-medium px-4 py-2 rounded-lg border border-slate-700/70 transition-all">Acquired</button>
      <button onclick="filterStatus(this, 'Public')" class="status-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs font-medium px-4 py-2 rounded-lg border border-slate-700/70 transition-all">Public</button>
      <button onclick="filterStatus(this, 'Active')" class="status-btn bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs font-medium px-4 py-2 rounded-lg border border-slate-700/70 transition-all">Active</button>
    </div>

    <!-- Main Grid -->
    <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </div>

  <!-- Full Intelligence Modal -->
  <div id="detailModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden items-center justify-center p-4 z-50 transition-opacity duration-300">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto p-6 md:p-8 shadow-2xl relative space-y-6">
      
      <!-- Close Button -->
      <button onclick="closeModal()" class="absolute top-5 right-5 text-slate-400 hover:text-white p-2 rounded-lg bg-slate-800/60 hover:bg-slate-800 transition">
        ✕
      </button>

      <!-- Modal Header -->
      <div>
        <div class="flex items-center gap-3 mb-2 flex-wrap">
          <h2 id="mName" class="text-3xl font-extrabold text-white"></h2>
          <span id="mBatch" class="bg-blue-900/40 text-blue-300 text-xs font-semibold px-3 py-1 rounded-full border border-blue-700/40"></span>
          <span id="mStatus" class="px-3 py-1 rounded-full text-xs font-semibold border"></span>
        </div>
        <p id="mOneLiner" class="text-slate-300 text-base font-medium italic"></p>
      </div>

      <!-- Categories -->
      <div id="mCategories" class="flex flex-wrap gap-2"></div>

      <!-- Key Details Grid -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 bg-slate-800/40 p-4 rounded-xl border border-slate-800">
        <div>
          <span class="text-slate-400 text-xs block font-medium">CEO</span>
          <span id="mCeo" class="text-white font-semibold text-sm"></span>
        </div>
        <div>
          <span class="text-slate-400 text-xs block font-medium">Team Size</span>
          <span id="mTeam" class="text-white font-semibold text-sm"></span>
        </div>
        <div>
          <span class="text-slate-400 text-xs block font-medium">Founded</span>
          <span id="mFounded" class="text-white font-semibold text-sm"></span>
        </div>
        <div>
          <span class="text-slate-400 text-xs block font-medium">Location</span>
          <span id="mLocation" class="text-white font-semibold text-sm"></span>
        </div>
      </div>

      <!-- Full Description -->
      <div>
        <h3 class="text-slate-200 text-xs font-bold uppercase tracking-wider mb-2">Company Overview</h3>
        <p id="mDescription" class="text-slate-300 text-sm leading-relaxed whitespace-pre-line bg-slate-950/40 p-4 rounded-xl border border-slate-800/60"></p>
      </div>

      <!-- Founders Section -->
      <div>
        <h3 class="text-slate-200 text-xs font-bold uppercase tracking-wider mb-3">Founders & Leadership</h3>
        <div id="mFounders" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
      </div>

      <!-- Links -->
      <div class="flex flex-wrap items-center gap-3 pt-4 border-t border-slate-800">
        <a id="mWebsite" href="#" target="_blank" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition-all inline-flex items-center gap-2">
          Visit Website ↗
        </a>
        <a id="mYcUrl" href="#" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold px-4 py-2.5 rounded-xl border border-slate-700 transition-all inline-flex items-center gap-2">
          View YC Profile ↗
        </a>
      </div>

    </div>
  </div>

  <script>
    let rawData = [];
    let currentStatus = 'all';
    let filteredDataset = [];

    async function loadData() {
      try {
        const res = await fetch('./sample_output.json');
        rawData = await res.json();
        filteredDataset = rawData;
        populateDropdowns(rawData);
        updateStats(rawData);
        renderCards(rawData);
      } catch (err) {
        document.getElementById('grid').innerHTML = '<div class="col-span-full text-center py-12 text-red-400">Failed to load dataset. Make sure sample_output.json is in the root directory.</div>';
      }
    }

    function populateDropdowns(data) {
      const batches = [...new Set(data.map(i => i.batch).filter(Boolean))].sort();
      const batchSelect = document.getElementById('batchSelect');
      batches.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b;
        opt.innerText = b;
        batchSelect.appendChild(opt);
      });

      const categories = [...new Set(data.flatMap(i => i.categories || []).filter(Boolean))].sort();
      const categorySelect = document.getElementById('categorySelect');
      categories.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.innerText = c;
        categorySelect.appendChild(opt);
      });
    }

    function updateStats(data) {
      document.getElementById('statTotal').innerText = data.length;
      document.getElementById('statAcquired').innerText = data.filter(i => (i.status || '').toLowerCase().includes('acquired')).length;
      document.getElementById('statPublic').innerText = data.filter(i => (i.status || '').toLowerCase().includes('public')).length;
      document.getElementById('statActive').innerText = data.filter(i => (i.status || '').toLowerCase().includes('active')).length;
    }

    function renderCards(items) {
      const grid = document.getElementById('grid');
      if (!items || items.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center py-12 text-slate-500">No matching startups found.</div>';
        return;
      }

      grid.innerHTML = items.map((item, index) => {
        const status = item.status || 'Active';
        let statusBadgeClass = 'bg-slate-700/50 text-slate-300 border-slate-600';
        if (status.toLowerCase().includes('acquired')) statusBadgeClass = 'bg-amber-500/10 text-amber-400 border-amber-500/30';
        else if (status.toLowerCase().includes('public')) statusBadgeClass = 'bg-blue-500/10 text-blue-400 border-blue-500/30';
        else if (status.toLowerCase().includes('active')) statusBadgeClass = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';

        const categories = (item.categories || []).map(c => `<span class="bg-slate-800 text-slate-400 text-[10px] font-medium px-2 py-0.5 rounded border border-slate-700/70">${c}</span>`).join(' ');

        return `
          <div class="bg-slate-900/80 hover:bg-slate-800/80 rounded-2xl p-6 border border-slate-800 hover:border-blue-500/40 transition-all duration-300 transform hover:-translate-y-1 hover:shadow-2xl hover:shadow-blue-500/10 flex flex-col justify-between group">
            <div>
              <div class="flex justify-between items-start gap-2 mb-2">
                <h2 class="text-xl font-extrabold text-white group-hover:text-blue-400 transition-colors">${item.company_name || item.name || 'Startup'}</h2>
                <span class="bg-blue-900/40 text-blue-300 text-xs font-semibold px-2.5 py-1 rounded-full border border-blue-700/30 whitespace-nowrap">${item.batch || 'YC'}</span>
              </div>
              
              ${categories ? `<div class="flex flex-wrap gap-1 mb-3">${categories}</div>` : ''}

              <p class="text-slate-300 text-sm mb-4 leading-relaxed line-clamp-2">${item.one_liner || item.company_description || 'No description provided.'}</p>
              
              ${item.ceo_name ? `
                <div class="bg-slate-950/50 border border-slate-800/80 rounded-xl p-2.5 mb-4 flex items-center gap-2">
                  <span class="text-base">👔</span>
                  <div>
                    <span class="text-[10px] uppercase font-bold text-slate-500 block">CEO</span>
                    <span class="text-xs font-semibold text-slate-200">${item.ceo_name}</span>
                  </div>
                </div>` : ''}
            </div>
            
            <div class="space-y-4 pt-3 border-t border-slate-800/80">
              <div class="flex flex-wrap gap-2 text-xs">
                <span class="${statusBadgeClass} px-2.5 py-1 rounded-md border font-semibold">${status}</span>
                ${item.team_size ? `<span class="bg-slate-800/60 text-slate-300 px-2.5 py-1 rounded-md border border-slate-700/60">👥 ${item.team_size}</span>` : ''}
                ${item.location ? `<span class="bg-slate-800/60 text-slate-300 px-2.5 py-1 rounded-md border border-slate-700/60">📍 ${item.location}</span>` : ''}
              </div>
              
              <div class="flex items-center justify-between pt-1">
                <button onclick="openModal(${index})" class="text-xs font-bold text-blue-400 hover:text-blue-300 bg-blue-500/10 hover:bg-blue-500/20 px-3 py-1.5 rounded-lg border border-blue-500/20 transition">
                  Full Details 🔍
                </button>
                ${item.website ? `
                  <a href="${item.website}" target="_blank" class="text-xs font-semibold text-slate-400 hover:text-white transition-colors">
                    Website ↗
                  </a>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function applyFilters() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const batchFilter = document.getElementById('batchSelect').value;
      const categoryFilter = document.getElementById('categorySelect').value;

      filteredDataset = rawData.filter(item => {
        const fullText = JSON.stringify(item).toLowerCase();
        const matchesSearch = fullText.includes(search);
        const matchesStatus = currentStatus === 'all' || (item.status || '').toLowerCase().includes(currentStatus.toLowerCase());
        const matchesBatch = batchFilter === 'all' || item.batch === batchFilter;
        const matchesCategory = categoryFilter === 'all' || (item.categories || []).includes(categoryFilter);

        return matchesSearch && matchesStatus && matchesBatch && matchesCategory;
      });

      renderCards(filteredDataset);
    }

    function filterStatus(btn, status) {
      currentStatus = status;
      document.querySelectorAll('.status-btn').forEach(b => {
        b.classList.remove('bg-blue-600', 'text-white');
        b.classList.add('bg-slate-800/80', 'text-slate-300');
      });
      btn.classList.remove('bg-slate-800/80', 'text-slate-300');
      btn.classList.add('bg-blue-600', 'text-white');
      applyFilters();
    }

    function openModal(index) {
      const item = filteredDataset[index] || rawData[index];
      if (!item) return;

      document.getElementById('mName').innerText = item.company_name || item.name || 'Startup';
      document.getElementById('mBatch').innerText = item.batch || 'YC';
      
      const status = item.status || 'Active';
      const mStatus = document.getElementById('mStatus');
      mStatus.innerText = status;
      mStatus.className = 'px-3 py-1 rounded-full text-xs font-semibold border ';
      if (status.toLowerCase().includes('acquired')) mStatus.className += 'bg-amber-500/10 text-amber-400 border-amber-500/30';
      else if (status.toLowerCase().includes('public')) mStatus.className += 'bg-blue-500/10 text-blue-400 border-blue-500/30';
      else mStatus.className += 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';

      document.getElementById('mOneLiner').innerText = item.one_liner || '';
      document.getElementById('mCeo').innerText = item.ceo_name || 'N/A';
      document.getElementById('mTeam').innerText = item.team_size ? `${item.team_size} employees` : 'N/A';
      document.getElementById('mFounded').innerText = item.year_founded || 'N/A';
      document.getElementById('mLocation').innerText = item.location || 'N/A';
      document.getElementById('mDescription').innerText = item.company_description || item.one_liner || 'No full description provided.';

      const cats = item.categories || [];
      document.getElementById('mCategories').innerHTML = cats.length ? cats.map(c => `<span class="bg-blue-950/60 text-blue-300 border border-blue-800/60 px-3 py-1 rounded-lg text-xs font-medium">${c}</span>`).join('') : '<span class="text-slate-500 text-xs">No categories tagged</span>';

      const founders = item.founders || [];
      document.getElementById('mFounders').innerHTML = founders.length ? founders.map(f => `
        <div class="bg-slate-950/60 border border-slate-800 p-3 rounded-xl flex items-center justify-between">
          <span class="text-sm font-bold text-white">${f.full_name}</span>
          <span class="text-xs font-medium text-slate-400 bg-slate-800 px-2 py-0.5 rounded">${f.title || 'Founder'}</span>
        </div>
      `).join('') : '<p class="text-slate-500 text-xs col-span-full">No founder information available.</p>';

      const webBtn = document.getElementById('mWebsite');
      if (item.website) {
        webBtn.href = item.website;
        webBtn.style.display = 'inline-flex';
      } else {
        webBtn.style.display = 'none';
      }

      const ycBtn = document.getElementById('mYcUrl');
      if (item.product_page_url) {
        ycBtn.href = item.product_page_url;
        ycBtn.style.display = 'inline-flex';
      } else {
        ycBtn.style.display = 'none';
      }

      document.getElementById('detailModal').classList.remove('hidden');
      document.getElementById('detailModal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.add('hidden');
      document.getElementById('detailModal').classList.remove('flex');
    }

    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('batchSelect').addEventListener('change', applyFilters);
    document.getElementById('categorySelect').addEventListener('change', applyFilters);
    
    document.getElementById('detailModal').addEventListener('click', (e) => {
      if (e.target.id === 'detailModal') closeModal();
    });

    loadData();
  </script>
</body>
</html>
