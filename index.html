<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CorpLens - YC Startup Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-6xl mx-auto">
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center pb-6 mb-8 border-b border-slate-800 gap-4">
      <div>
        <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">CorpLens Dashboard</h1>
        <p class="text-slate-400 text-sm mt-1">Real-time Y Combinator Startup Intelligence Powered by Bright Data</p>
      </div>
      <input type="text" id="searchInput" placeholder="Search by name, status, or batch..." class="bg-slate-800 text-slate-200 px-4 py-2 rounded-lg border border-slate-700 focus:outline-none focus:border-blue-500 w-full md:w-80">
    </header>

    <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </div>

  <script>
    let rawData = [];

    async function loadData() {
      try {
        const res = await fetch('./sample_output.json');
        rawData = await res.json();
        renderCards(rawData);
      } catch (err) {
        document.getElementById('grid').innerHTML = '<p class="text-red-400">Loading data...</p>';
      }
    }

    function renderCards(items) {
      const grid = document.getElementById('grid');
      if (!items || items.length === 0) {
        grid.innerHTML = '<p class="text-slate-400">No matching startups found.</p>';
        return;
      }
      grid.innerHTML = items.map(item => `
        <div class="bg-slate-800/70 rounded-xl p-5 border border-slate-700/60 hover:border-blue-500/50 transition duration-200 flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-start mb-3 gap-2">
              <h2 class="text-xl font-bold text-white">${item.name || item.company_name || 'Startup'}</h2>
              <span class="bg-blue-500/20 text-blue-400 text-xs font-semibold px-2.5 py-1 rounded-full border border-blue-500/30 whitespace-nowrap">${item.batch || 'YC'}</span>
            </div>
            <p class="text-slate-300 text-sm mb-4 line-clamp-3">${item.description || item.one_liner || 'No description provided.'}</p>
          </div>
          <div>
            <div class="flex flex-wrap gap-2 text-xs text-slate-400 mb-4">
              ${item.status ? `<span class="bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/20">${item.status}</span>` : ''}
              ${item.team_size ? `<span class="bg-slate-700/60 px-2 py-0.5 rounded">👥 ${item.team_size}</span>` : ''}
              ${item.location ? `<span class="bg-slate-700/60 px-2 py-0.5 rounded">📍 ${item.location}</span>` : ''}
            </div>
            ${item.website ? `<a href="${item.website}" target="_blank" class="inline-flex items-center text-xs font-semibold text-blue-400 hover:text-blue-300">Visit Website <span class="ml-1">→</span></a>` : ''}
          </div>
        </div>
      `).join('');
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = rawData.filter(i => JSON.stringify(i).toLowerCase().includes(query));
      renderCards(filtered);
    });

    loadData();
  </script>
</body>
</html>
