<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CorpLens - YC Startup Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen p-4 md:p-8 font-sans antialiased">
  <div class="max-w-7xl mx-auto space-y-8">
    
    <!-- Header & Search -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pb-6 border-b border-slate-800">
      <div>
        <div class="flex items-center gap-3">
          <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
          <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-blue-400 via-indigo-300 to-emerald-400 bg-clip-text text-transparent">CorpLens Dashboard</h1>
        </div>
        <p class="text-slate-400 text-sm mt-1">Real-time Y Combinator Startup Intelligence Powered by Bright Data</p>
      </div>
      
      <!-- Search Input -->
      <div class="relative w-full md:w-96">
        <input type="text" id="searchInput" placeholder="Search startups, locations, batch..." class="w-full bg-slate-800/80 text-slate-200 pl-10 pr-4 py-2.5 rounded-xl border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all placeholder-slate-500 text-sm">
        <svg class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </div>
    </header>

    <!-- Dynamic Analytics Stats Bar -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="statsBar">
      <div class="bg-slate-800/40 border border-slate-800 rounded-xl p-4 flex flex-col">
        <span class="text-slate-400 text-xs font-medium uppercase tracking-wider">Total Scraped</span>
        <span class="text-2xl font-bold text-white mt-1" id="statTotal">0</span>
      </div>
      <div class="bg-slate-800/40 border border-slate-800 rounded-xl p-4 flex flex-col">
        <span class="text-slate-400 text-xs font-medium uppercase tracking-wider">Acquired</span>
        <span class="text-2xl font-bold text-amber-400 mt-1" id="statAcquired">0</span>
      </div>
      <div class="bg-slate-800/40 border border-slate-800 rounded-xl p-4 flex flex-col">
        <span class="text-slate-400 text-xs font-medium uppercase tracking-wider">Public</span>
        <span class="text-2xl font-bold text-blue-400 mt-1" id="statPublic">0</span>
      </div>
      <div class="bg-slate-800/40 border border-slate-800 rounded-xl p-4 flex flex-col">
        <span class="text-slate-400 text-xs font-medium uppercase tracking-wider">Active</span>
        <span class="text-2xl font-bold text-emerald-400 mt-1" id="statActive">0</span>
      </div>
    </div>

    <!-- Quick Filter Chips -->
    <div class="flex flex-wrap items-center gap-2" id="filterBar">
      <button onclick="filterStatus(this, 'all')" class="filter-btn active bg-blue-600 text-white text-xs font-medium px-4 py-2 rounded-lg transition-all">All Companies</button>
      <button onclick="filterStatus(this, 'Acquired')" class="filter-btn bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium px-4 py-2 rounded-lg transition-all border border-slate-700">Acquired</button>
      <button onclick="filterStatus(this, 'Public')" class="filter-btn bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium px-4 py-2 rounded-lg transition-all border border-slate-700">Public</button>
      <button onclick="filterStatus(this, 'Active')" class="filter-btn bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium px-4 py-2 rounded-lg transition-all border border-slate-700">Active</button>
    </div>

    <!-- Cards Grid -->
    <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </div>

  <script>
    let rawData = [];
    let currentFilter = 'all';

    async function loadData() {
      try {
        const res = await fetch('./sample_output.json');
        rawData = await res.json();
        updateStats(rawData);
        renderCards(rawData);
      } catch (err) {
        document.getElementById('grid').innerHTML = '<div class="col-span-full text-center py-12"><p class="text-red-400 font-medium">Loading output dataset...</p></div>';
      }
    }

    function updateStats(data) {
      document.getElementById('statTotal').innerText = data.length;
      document.getElementById('statAcquired').innerText = data.filter(i => (i.status || '').toLowerCase().includes('acquired')).length;
      document.getElementById('statPublic').innerText = data.filter(i => (i.status || '').toLowerCase().includes('public')).length;
      document.getElementById('statActive').innerText = data.filter(i => (i.status || '').toLowerCase().includes('active')).length;
    }

    function renderCards(items) {
      const grid = document.getElementById('grid');
      if (!items || items.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center py-12 text-slate-500">No matching startups found.</div>';
        return;
      }
      grid.innerHTML = items.map(item => {
        const status = item.status || 'Active';
        let statusBadgeClass = 'bg-slate-700/50 text-slate-300 border-slate-600';
        if (status.toLowerCase().includes('acquired')) statusBadgeClass = 'bg-amber-500/10 text-amber-400 border-amber-500/20';
        else if (status.toLowerCase().includes('public')) statusBadgeClass = 'bg-blue-500/10 text-blue-400 border-blue-500/20';
        else if (status.toLowerCase().includes('active')) statusBadgeClass = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';

        return `
          <div class="bg-slate-800/50 hover:bg-slate-800/80 rounded-2xl p-6 border border-slate-700/60 hover:border-blue-500/40 transition-all duration-300 transform hover:-translate-y-1 hover:shadow-2xl hover:shadow-blue-500/10 flex flex-col justify-between group">
            <div>
              <div class="flex justify-between items-start gap-2 mb-3">
                <h2 class="text-xl font-bold text-white group-hover:text-blue-400 transition-colors">${item.name || item.company_name || 'Startup'}</h2>
                <span class="bg-blue-900/40 text-blue-300 text-xs font-semibold px-2.5 py-1 rounded-full border border-blue-700/30 whitespace-nowrap">${item.batch || 'YC'}</span>
              </div>
              <p class="text-slate-300 text-sm mb-5 leading-relaxed line-clamp-3">${item.description || item.one_liner || 'No description provided.'}</p>
            </div>
            
            <div class="space-y-4 pt-2 border-t border-slate-700/40">
              <div class="flex flex-wrap gap-2 text-xs">
                <span class="${statusBadgeClass} px-2.5 py-1 rounded-md border font-medium">${status}</span>
                ${item.team_size ? `<span class="bg-slate-700/40 text-slate-300 px-2.5 py-1 rounded-md border border-slate-700">👥 ${item.team_size}</span>` : ''}
                ${item.location ? `<span class="bg-slate-700/40 text-slate-300 px-2.5 py-1 rounded-md border border-slate-700">📍 ${item.location}</span>` : ''}
              </div>
              ${item.website ? `
                <a href="${item.website}" target="_blank" class="inline-flex items-center text-xs font-semibold text-blue-400 hover:text-blue-300 transition-colors">
                  Visit Website 
                  <svg class="w-3.5 h-3.5 ml-1 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </a>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function filterStatus(btn, status) {
      currentFilter = status;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('bg-blue-600', 'text-white');
        b.classList.add('bg-slate-800', 'text-slate-300');
      });
      btn.classList.remove('bg-slate-800', 'text-slate-300');
      btn.classList.add('bg-blue-600', 'text-white');

      applyFilters();
    }

    function applyFilters() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const filtered = rawData.filter(item => {
        const matchesSearch = JSON.stringify(item).toLowerCase().includes(search);
        const matchesStatus = currentFilter === 'all' || (item.status || '').toLowerCase().includes(currentFilter.toLowerCase());
        return matchesSearch && matchesStatus;
      });
      renderCards(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', applyFilters);
    loadData();
  </script>
</body>
</html>
